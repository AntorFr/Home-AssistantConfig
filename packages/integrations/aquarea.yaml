template:
  - unique_id: "pompe_a_chaleur"
    sensor:
      - name: "Pap - Temperature eau chaude"
        unit_of_measurement: "°C"
        state: "{{ '%+.1f'|format(state_attr('water_heater.garage_1_pompe_a_chaleur_garage_eau_chaude_sanitaire','current_temperature')) }}"
        state_class: "measurement"
        device_class: "temperature"
      - name: "Pap - Temperature chauffage"
        unit_of_measurement: "°C"
        state: "{{ '%+.1f'|format(state_attr('climate.garage_1_pompe_a_chaleur_garage_chauffage_zone_1','current_temperature')) }}"
        state_class: "measurement"
        device_class: "temperature"


