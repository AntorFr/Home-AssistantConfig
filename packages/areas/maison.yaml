input_select:
  maison_ambiance: #input_select.maison_ambiance
    name: "Ambiance maison"
    options:
      - Normal
      - Noël
      - Reveillon
      - Halloween
    icon: mdi:party-popper

automation:
- id: 'change_ambiance_maison'
  alias: Area - Maison - Change ambiance maison
  description: ''
  mode: restart
  trigger:
    - trigger: state
      entity_id:
        - input_select.maison_ambiance
  condition: []
  action:
    - choose:
        - conditions: 
          - condition: template
            value_template: "{{trigger.to_state.state == 'Normal'}}"
          sequence:
            - action: script.change_tx_ultimate_night_effect
              data:
                effect: "Default"
        - conditions: 
          - condition: template
            value_template: "{{trigger.to_state.state == 'Noël'}}"
          sequence:
            - action: script.change_tx_ultimate_night_effect
              data:
                effect: Christmas
        - conditions: 
          - condition: template
            value_template: "{{trigger.to_state.state == 'Reveillon'}}"
          sequence:
            - action: script.change_tx_ultimate_night_effect
              data:
                effect: Explore the Stars
        # Halloween: the switches take their Halloween theme; the tablets and matrix clocks
        # follow through their own "Ambiance" select (below).
        - conditions: 
          - condition: template
            value_template: "{{trigger.to_state.state == 'Halloween'}}"
          sequence:
            - action: script.change_tx_ultimate_night_effect
              data:
                effect: Halloween
    # Dashboard tablets and matrix clocks: each one has its own "Ambiance" select
    # (remembered on the device), set to the house ambiance. Same option names as this
    # input_select. Their entity ids carry the area (select.bureau_dashboard_bureau_ambiance),
    # hence the match on any ESPHome select ending in _ambiance.
    - action: select.select_option
      continue_on_error: true
      target:
        entity_id: >
          {{integration_entities('esphome')|select('match','^select\\..*_ambiance$')| list }}
      data:
        option: "{{ trigger.to_state.state }}"
          
script:  
################################################################################
  change_tx_ultimate_night_effect:
    alias: "Area - Maison - Change effet nuit"
    icon: mdi:gesture-tap-button
    mode: restart
    fields:
      effect:
        name: Effet
        required: True
        default: None
        selector:
          select:
            options:
              - Default
              - Explore the Stars
              - Christmas
              - Halloween
    sequence:
      # Theme select of every TX Ultimate switch (select.bouton_*_theme). The firmware
      # before 2026-10 exposed select.*_nightlight_effect instead.
      - action: select.select_option
        target:
          entity_id: >
            {{states.select|map(attribute="entity_id")|select('match','^select\\.bouton_.*_theme$')| list }}
        data:
          option: "{{effect}}"
