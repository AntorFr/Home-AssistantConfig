script:
################################################################################
  heating_hot_water_forced:
    alias: Heating - Eau chaude chauffe forcée
    icon: mdi:water-boiler-alert
    sequence:
      - action: water_heater.set_temperature
        metadata: {}
        data:
          temperature: 65
        target:
          entity_id: water_heater.garage_1_pompe_a_chaleur_garage_eau_chaude_sanitaire
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.garage_1_pompe_a_chaleur_garage_forcage_ecs
      - action: select.select_option
        metadata: {}
        data:
          option: "90 min"
        target:
          entity_id: select.garage_1_pompe_a_chaleur_garage_mode_boost
      - delay:
          hours: 0
          minutes: 1
          seconds: 0
          milliseconds: 0
      - wait_template: "{{ state_attr('water_heater.garage_1_pompe_a_chaleur_garage_eau_chaude_sanitaire','current_temperature')> 50 }}"
        continue_on_timeout: true
        timeout: "90:00:00"
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: switch.garage_1_pompe_a_chaleur_garage_forcage_ecs
      - action: water_heater.set_temperature
        metadata: {}
        data:
          temperature: 55
        target:
          entity_id: water_heater.garage_1_pompe_a_chaleur_garage_eau_chaude_sanitaire